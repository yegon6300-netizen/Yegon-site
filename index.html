<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yegon Site</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 13px 25px;
      border-radius: 8px;
      text-decoration: none;
    }

    .about {
      padding: 50px 20px;
      text-align: center;
    }

    .about h2 {
      margin-bottom: 15px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Yegon Site</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Welcome to Yegon Site</h2>
    <p>Welcome to my personal website.</p>
    <a href="#about" class="btn">Learn More</a>
  </section>

  <section class="about" id="about">
    <h2>About Me</h2>
    <p>
      This is my website where I can share my information,
      projects and ideas.
    </p>
  </section>

  <footer id="contact">
    <p>© 2026 Yegon Site. All rights reserved.</p>
  </footer>

</body>
</html>
